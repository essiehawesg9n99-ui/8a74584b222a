            printf 'duty 0.3\n' > thr.cfg
      - run:
          name: Build actuator driver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target thruster_pwm -j2
      - run:
          name: Modulate thruster PWM
          command: LIONSS_LP=1 ./build/thruster_pwm --conf thr.cfg --freq 10
  exposureFuse:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
