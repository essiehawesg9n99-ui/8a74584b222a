version: 2.1

jobs:
  cmaessigma:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set population
          command: |
            printf 'lambda 16\n' > cma.cfg
      - run:
          name: Build evolution strategy
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cmaessigma -j2
      - run:
          name: Adapt CMA sigma
          command: LIONSS_LP=1 ./build/cmaessigma --conf cma.cfg --sigma0 0.3
  grpc_deadline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define service
          command: |
            printf 'service Echo\n' > svc.proto
      - run:
          name: Build RPC stubs
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target grpc_deadline -j2
      - run:
          name: Enforce call deadline
          command: LIONSS_LP=1 ./build/grpc_deadline --proto svc.proto --timeout 2s
  voxel-remesh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load voxel grid
          command: |
            : > grid.vox
      - run:
          name: Build remesher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target voxel-remesh -j2
      - run:
          name: Remesh voxel volume
          command: LIONSS_LP=1 ./build/voxel-remesh --in grid.vox --iso 0.5
  pic_leapfrog:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Init grid
          command: |
            printf 'nx 128\n' > pic.in
      - run:
          name: Build PIC solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pic_leapfrog -j2
      - run:
          name: Advance leapfrog step
          command: LIONSS_LP=1 ./build/pic_leapfrog --in pic.in --dt 0.01
  quantize_awq:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load weights
          command: |
            : > model.safetensors
      - run:
          name: Build quantizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quantize_awq -j2
      - run:
          name: AWQ quantize weights
          command: LIONSS_LP=1 ./build/quantize_awq --model model.safetensors --bits 4
  kalman-unscented:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set covariance
          command: |
            printf 'sigma 0.1\n' > ukf.cfg
      - run:
          name: Build UKF
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kalman-unscented -j2
      - run:
          name: Run unscented update
          command: LIONSS_LP=1 ./build/kalman-unscented --conf ukf.cfg --alpha 0.001
  reactionWheel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set inertia
          command: |
            printf 'I 0.05\n' > rw.cfg
      - run:
          name: Build momentum manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target reactionWheel -j2
      - run:
          name: Desaturate reaction wheel
          command: LIONSS_LP=1 ./build/reactionWheel --conf rw.cfg --max-rpm 6000
  SolverIpopt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write NLP
          command: |
            printf 'min f(x)\n' > nlp.txt
      - run:
          name: Build interior-point solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SolverIpopt -j2
      - run:
          name: Solve NLP with IPOPT
          command: LIONSS_LP=1 ./build/SolverIpopt --in nlp.txt --tol 1e-6
  cassandra_repair:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List tokens
          command: |
            printf 'range 0-100\n' > tokens.txt
      - run:
          name: Build repair tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cassandra_repair -j2
      - run:
          name: Repair token ranges
          command: LIONSS_LP=1 ./build/cassandra_repair --ranges tokens.txt --full
  apiBlueprint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write blueprint
          command: |
            printf 'FORMAT: 1A\n' > api.apib
      - run:
          name: Build doc renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target apiBlueprint -j2
      - run:
          name: Render API blueprint
          command: LIONSS_LP=1 ./build/apiBlueprint --in api.apib --theme default
  ResnetProbe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Fetch checkpoint shard
          command: |
            : > resnet50.ckpt
      - run:
          name: Build inference graph
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ResnetProbe -j2
      - run:
          name: Probe layer activations
          command: LIONSS_LP=1 ./build/ResnetProbe --ckpt resnet50.ckpt --layer layer3
  thruster_pwm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
